version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@10.12.4 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Amplify only exposes env vars to the Next.js server if they are in .env.production.
        - env | grep -e '^HOMEWARD_' >> .env.production || true
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
